<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOALINK | Detalhes da Doação</title>

    <link rel="stylesheet" href="css/detalhe.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <header>

        <div class="logo">

            <h1>DOALINK</h1>

        </div>

        <nav>

            <a href="home.html">Início</a>

            <a href="publicar.html">Publicar</a>

            <a href="perfil.html">Perfil</a>

        </nav>

    </header>


    <main class="container">

        <div class="imagem">

            <img
                id="fotoDoacao"
                src=""
                alt="Imagem da doação"
            >

        </div>


        <div class="informacoes">

            <h2 id="titulo"></h2>

            <p id="descricao"></p>

            <p>
                <strong>Categoria:</strong>
                <span id="categoria"></span>
            </p>

            <p>
                <strong>Cidade:</strong>
                <span id="cidade"></span>
            </p>

            <p>
                <strong>Doador:</strong>
                <span id="usuario"></span>
            </p>

            <p>
                <strong>Telefone:</strong>
                <span id="telefone"></span>
            </p>

            <p>
                <strong>Data:</strong>
                <span id="data"></span>
            </p>
<button id="interesse">
    Tenho Interesse
</button>

<!-- FORMULÁRIO DE CONTATO -->

<div id="formContato" class="form-contato" style="display: none;">

    <h3>Entrar em contato com o doador</h3>

    <p>
        Preencha os dados abaixo para demonstrar seu interesse nesta doação.
    </p>

    <label for="nomeContato">
        Seu nome
    </label>

    <input
        type="text"
        id="nomeContato"
        placeholder="Digite seu nome"
    >

    <label for="telefoneContato">
        Seu telefone
    </label>

    <input
        type="text"
        id="telefoneContato"
        placeholder="Digite seu telefone"
    >

    <label for="mensagemContato">
        Mensagem
    </label>

    <textarea
        id="mensagemContato"
        placeholder="Digite sua mensagem"
        rows="5"
    ></textarea>

    <button id="enviarMensagem">
        Enviar Mensagem
    </button>

</div>

        </div>

    </main>


    <script src="js/detalhe.js"></script>

</body>

</html>
