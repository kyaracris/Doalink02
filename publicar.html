<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOALINK | Publicar Doação</title>

    <link rel="stylesheet" href="css/publicar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">

            <h1>DOALINK</h1>

        </div>

        <nav>

            <a href="home.html">Início</a>

            <a href="publicar.html">Publicar Doação</a>

            <a href="minhas-doacoes.html">Minhas Doações</a>

            <a href="favoritos.html">Favoritos</a>

            <a href="perfil.html">Perfil</a>

        </nav>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main>

        <section class="formulario">

            <h2>Publicar uma Doação</h2>

            <p>
                Preencha as informações abaixo para disponibilizar
                um item para alguém que precisa.
            </p>


            <form id="formDoacao">

                <div class="campo">

                    <label for="titulo">
                        Título da doação
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Roupas infantis"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        placeholder="Descreva o item que será doado"
                        required
                    ></textarea>

                </div>


                <div class="campo">

                    <label for="categoria">
                        Categoria
                    </label>

                    <select id="categoria" required>

                        <option value="">
                            Selecione uma categoria
                        </option>

                        <option value="Roupas">
                            Roupas
                        </option>

                        <option value="Alimentos">
                            Alimentos
                        </option>

                        <option value="Móveis">
                            Móveis
                        </option>

                        <option value="Materiais Escolares">
                            Materiais Escolares
                        </option>

                        <option value="Brinquedos">
                            Brinquedos
                        </option>

                        <option value="Eletrônicos">
                            Eletrônicos
                        </option>

                        <option value="Outros">
                            Outros
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Digite sua cidade"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone para contato
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="Ex: (11) 99999-9999"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="imagem">
                        Imagem da doação
                    </label>

                    <input
                        type="file"
                        id="imagem"
                        accept="image/*"
                    >

                </div>


                <button type="submit">
                    Publicar Doação
                </button>

            </form>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        <p>
            © 2026 DOALINK - Todos os direitos reservados.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/publicar.js"></script>

</body>

</html>
