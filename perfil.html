<!DOCTYPE html>

    <link rel="stylesheet" href="css/perfil.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

</head>

<body>

    <!-- CABEÇALHO -->

    <header>

        <div class="logo">
            <h1>DOALINK</h1>
        </div>

        <nav>

            <a href="publicar.html">Publicar Doação</a>

    <!-- CONTEÚDO -->

    <main>

        <section class="perfil">

            <div class="perfil-topo">

                <div class="avatar">

            <div class="informacoes">

                <div class="info">

                    <p id="nomeCompleto">

                <div class="info">

                    <p id="emailCompleto">
                        -
                    </p>

                </div>

            </div>


            <div class="estatisticas">

                <div class="estatistica">

                    <span id="totalDoacoes">
                        0
                    </span>

                </div>


                <div class="estatistica">

                    <span id="totalFavoritos">

                    <p>Favoritos</p>

                </div>

            </div>


            <div class="acoes">

                <a href="publicar.html" class="botao">
                    Publicar Doação
                </a>

                <a href="minhas-doacoes.html" class="botao">
                    Minhas Doações

                </button>

    <!-- RODAPÉ -->

    <footer>
